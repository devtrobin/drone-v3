<p>Leitungen ab 4 mm² sind auch als Lade- oder Anlasserkabel verwendbar. Ausführung FLRY-B.<br />ECu Kupferleiter mit asymetrischem Aufbau und einem Reinheitsgrad von 99,99 %, sowie einer Ummantelung aus thermoplastischem Kunststoff mit einer Shore-Härte von Sh90 gelten als die modernsten Fahrzeugleitungen in der Automobil und Fahrzeugindustrie. <br />Beim Kabelaufbau kommen Einzeldrähte mit einem Durchmesser von max 0,300 mm zum Einsatz. Dadurch werden die Leitungen hoch flexibel und widerstandsfähig gegen Kabelbruch.</p>
<h3>Technische Informationen</h3>
<ul>
<li>Elektrolyt Kupferleiter ECu, blank</li>
<li>Nennquerschnitt: 6,00 mm²</li>
<li>Außendurchmesser: ca. 4,7 mm</li>
<li>Durchmesser Einzeldrähte: max. 0,300 mm</li>
<li>Nennspannung U~=50V U-=60V</li>
<li>Temperatureinsatzbereich Klasse A -40°C bis +70°C</li>
<li>Silikon-, Cadmium- und Bleifrei</li>
<li>Leistungsnachweis: DIN 72551 / ISO 6722</li>
</ul>
<h3>Hinweis</h3>
<p class="as--hinweis-detail">Querschnitt ist <strong>NICHT</strong> Durchmesser<br />Der Querschnitt ist ein Flächenmaß<br />Der Durchmesser ist ein Längenmaß</p>
<p class="as--hinweis-detail-1">Berechnung Querschnitt A aus Durchmesser d:</p>
<ul class="as--list--unstyled">
<li>d² * π / 4</li>
</ul>
<p class="as--hinweis-detail-1">Berechnung Durchmesser d aus Querschnitt A:</p>
<ul class="as--list--unstyled">
<li>2 * √A / π</li>
</ul>
<p class="as--hinweis-detail-2">Beispiel für 2,5mm² Kabel:</p>
<ul class="as--list--unstyled">
<li>Durchmesser (Leiter) = 2 * √2,5 / π = ≈1,784 mm</li>
<li>Querschnitt (Leiter) = 1,784² * π / 4 = ≈2,5 mm²</li>
</ul></c4u-kaleidos-ui-tabbody></div></template><template  id="eshop_product_form_product_detail_slot_product-slider" v-slot:product-slider></template></c4u-eshop-product-detail></div><c4u-kaleidos-tools-event :event='[{"eventType":"CUSTOM","customType":"c4u_eshop_header","params":{"activeCategories":["c4u_aupwebshoplive_2066","c4u_aupwebshoplive_2004","c4u_aupwebshoplive_1297","c4u_aupwebshoplive_1289"],"activeRightMenuId":"c4u_nejaes231119_1115","languageId":"de","canonicalUrl":"https://auprotec.de/de/elektrik/fahrzeugleitungen-einadrig/flry-b-leitung/6-00-mm2-flry-b-leitung/flry-b-6-0-mm2-batteriekabel-rot-6m-ring/p/044906","title":"FLRY-B 6,0 mm² Batteriekabel rot – 6m Ring | AUPROTEC","meta":[{"name":"viewport","content":"width\u003ddevice-width,initial-scale\u003d1"},{"charset":"utf-8"},{"name":"revisit-after","content":"14 days"},{"name":"generator","content":"comm.grapheo 2.0"},{"name":"author","content":"Auprotec \u0026 Co KG"},{"name":"publisher","content":"Auprotec \u0026 Co KG; mailto:info@auprotec.de"},{"name":"copyright","content":"Auprotec \u0026 Co KG; mailto:info@auprotec.de"},{"property":"og:url","content":"https://auprotec.de/de/elektrik/fahrzeugleitungen-einadrig/flry-b-leitung/6-00-mm2-flry-b-leitung/flry-b-6-0-mm2-batteriekabel-rot-6m-ring/p/044906"},{"property":"og:locale","content":"de"},{"name":"mobile-web-app-capable","content":"yes"},{"name":"apple-mobile-web-app-capable","content":"yes"},{"name":"apple-mobile-web-app-status-bar-style","content":"default"},{"name":"twitter:card","content":"summary_large_image"},{"name":"theme-color","content":"#ffffff"},{"name":"apple-mobile-web-app-title","content":"AUPROTEC Online Shop | Für Profis, Heimwerker und Bastler"},{"property":"og:site_name","content":"AUPROTEC Online Shop | Für Profis, Heimwerker und Bastler"},{"name":"twitter:site","content":"AUPROTEC Online Shop | Für Profis, Heimwerker und Bastler"},{"name":"robots","content":"index,follow"},{"name":"description","content":"Auto Kabel 6 mm²
